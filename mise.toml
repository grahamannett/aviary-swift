min_version = "2025.8.0"
# macOS still needs Xcode or Command Line Tools for the SDK.

[tools]
    python = "3.14.8"
    swift  = "6.3.3"
    uv     = "0.12.23"


[tasks.resolve]
    description = "Resolve Swift package dependencies"
    run         = "swift package resolve"
    alias       = "deps"

[tasks.build-debug]
    description = "Debug build of aviary"
    run         = "swift build --product aviary"
    alias       = "d"

[tasks.build]
    description = "Release build of aviary"
    run         = "swift build -c release"
    alias       = "b"

[tasks.test]
    description = "Run unit tests"
    run         = "swift test"
    alias       = "t"

[tasks.test-filter]
    description = "Run tests matching an XCTest filter"
    usage = """
arg "<filter>" help="Test name filter passed to swift test --filter"
"""
    run = 'swift test --filter "${usage_filter}"'

[tasks.run]
    description = "Debug-build then run aviary with extra args (from caller cwd)"
    depends = ["build-debug"]
    dir = "{{cwd}}"
    usage = """
arg "<cli_args>" var=#true help="Arguments forwarded to aviary"
"""
    run = '"$MISE_PROJECT_ROOT/.build/debug/aviary" ${usage_cli_args-}'

[tasks.aviary]
    description = "Release-build then run aviary with extra args"
    depends = ["build"]
    dir = "{{cwd}}"
    usage = """
arg "<cli_args>" var=#true help="Arguments forwarded to aviary"
"""
    run = '"$MISE_PROJECT_ROOT/.build/release/aviary" ${usage_cli_args-}'

[tasks.clean]
    description = "Remove Swift build artifacts"
    run         = "swift package clean"

[tasks.ci]
    description = "Run Swift tests, Python checks, and release-tooling tests"
    depends     = ["test", "check-python", "test-release-tooling"]

[tasks.check-python]
    description = "Check Python lint and formatting with pinned Ruff"
    dir = "{{config_root}}"
    run = [
        "uvx ruff@0.17.0 check scripts Tests/Distribution",
        "uvx ruff@0.17.0 format --check scripts Tests/Distribution",
    ]

[tasks.format-python]
    description = "Apply safe Python lint fixes and format release tooling and tests"
    dir = "{{config_root}}"
    run = [
        "uvx ruff@0.17.0 check --fix scripts Tests/Distribution",
        "uvx ruff@0.17.0 format scripts Tests/Distribution",
    ]

[tasks.test-release-tooling]
    description = "Test release publication, archive metadata, and license handling"
    run         = "uv run --no-project --python 3.14.8 python -m unittest discover -s Tests/Distribution"

[tasks.release]
    description = "Bump, check, and publish a stable Aviary release"
    dir = "{{config_root}}"
    usage = """
arg "<version>" help="Stable release version, for example 0.2.0"
flag "--resume" help="Continue an interrupted release without replacing its tag"
"""
    run = '''
set -- "$usage_version"
if [ "$usage_resume" = "true" ]; then
    set -- "$@" --resume
fi
uv run --no-project --python 3.14.8 python scripts/release.py publish "$@"
'''

[tasks.repair-tap]
    description = "Repair the Homebrew formula from an existing public stable release"
    dir = "{{config_root}}"
    usage = '''
arg "<version>" help="Published stable release version, for example 0.2.0"
'''
    run = 'uv run --no-project --python 3.14.8 python scripts/release.py update-tap "$usage_version"'

# - All below are related to MISE_ENV=test
[tasks."check:brew_install"]
    description = "Install Aviary with the shared installer-test environment"
    run         = "mise -E test run _brew_install"

[tasks."check:brew_test"]
    description = "Run Aviary's Homebrew formula tests"
    run         = "mise -E test run _brew_test"

[tasks."check:brew_uninstall"]
    description = "Uninstall the Aviary Homebrew test installation"
    run         = "mise -E test run _brew_uninstall"

[tasks."check:brew_untap"]
    description = "Untap the Homebrew tap added for testing"
    run         = "mise -E test run _brew_untap"

[tasks."check:mise_install"]
    description = "Install Aviary in the temporary mise environment"
    run         = "mise -E test run _mise_install"

[tasks."check:mise_bird"]
    description = "Configure and verify the bird command wrapper in the temporary mise environment"
    run         = "mise -E test run _mise_bird"

[tasks."check:mise_uninstall"]
    description = "Uninstall Aviary from the temporary mise environment"
    run         = "mise -E test run _mise_uninstall"

[tasks.watch]
    description = "Rebuild debug binary on source changes"
    run         = "mise watch build-debug"
    hide        = true
