# Shared environment for the check:brew_* and check:mise_* tasks in mise.toml.
[vars]
    root    = "{{ env.AVIARY_INSTALL_TEST_ROOT | default(value='/tmp/aviary-install-test') }}"
    version = "{{ env.AVIARY_INSTALL_TEST_VERSION | default(value='0.2.0') }}"

[env]
    AVIARY_INSTALL_TEST_ROOT       = "{{ vars.root }}"
    AVIARY_INSTALL_TEST_VERSION    = "{{ vars.version }}"
    HOME                           = "{{ vars.root }}/home"
    XDG_CONFIG_HOME                = "{{ vars.root }}/config"
    MISE_CONFIG_DIR                = "{{ vars.root }}/config/mise"
    MISE_DATA_DIR                  = "{{ vars.root }}/data"
    MISE_CACHE_DIR                 = "{{ vars.root }}/cache"
    MISE_STATE_DIR                 = "{{ vars.root }}/state"
    MISE_GLOBAL_CONFIG_FILE        = false
    MISE_OVERRIDE_CONFIG_FILENAMES = false
    MISE_CONFIG_FILE               = false
    AUTH_TOKEN                     = false
    CT0                            = false
    BIRD_QUERY_IDS_CACHE           = false
    AVIARY_QUERY_IDS_CACHE         = false
    AVIARY_FEATURES_CACHE          = false
    BIRD_FEATURES_CACHE            = false
    AVIARY_SKIP_QUERY_ID_REFRESH   = "1"
    HOMEBREW_NO_AUTO_UPDATE        = "1"
    HOMEBREW_NO_INSTALL_CLEANUP    = "1"
    INSTALL_BREW_TAP               = "grahamannett/tap"
    INSTALL_MISE_PATH              = "github:grahamannett/aviary-swift"

[tasks._brew_install]
    hide = true
    dir  = "/tmp"
    run  = "brew install $INSTALL_BREW_TAP/aviary"

[tasks._brew_test]
    hide = true
    dir  = "/tmp"
    run  = "brew test $INSTALL_BREW_TAP/aviary"

[tasks._brew_uninstall]
    hide = true
    dir  = "/tmp"
    run  = "brew uninstall $INSTALL_BREW_TAP/aviary"

[tasks._brew_untap]
    hide = true
    dir  = "/tmp"
    run  = "brew untap $INSTALL_BREW_TAP"

[tasks._mise_install]
    hide = true
    dir  = "/tmp"
    run  = 'mise use -g "${INSTALL_MISE_PATH}@${AVIARY_INSTALL_TEST_VERSION}"'

[tasks._mise_bird]
    hide = true
    dir  = "/tmp"
    shell = "bash -euo pipefail -c"
    run = '''
case "$AVIARY_INSTALL_TEST_ROOT" in
    /*) ;;
    *) echo 'AVIARY_INSTALL_TEST_ROOT must be an absolute path' >&2; exit 1 ;;
esac
mise version | uv run --no-project --python 3.14.8 python -c '
import sys
version = tuple(map(int, sys.stdin.read().split()[0].split(".")))
if version < (2026, 10, 3):
    sys.exit("The bird wrapper check requires mise 2026.10.3 or newer")
'
# Replacing the tool entry clears rename_exe left by the previous check.
mise config set --global "tools.$INSTALL_MISE_PATH" "$AVIARY_INSTALL_TEST_VERSION"
mise use -g --force "${INSTALL_MISE_PATH}@${AVIARY_INSTALL_TEST_VERSION}"
mise config set --global wrappers.bird aviary
mise reshim
aviary_version="$("$MISE_DATA_DIR/shims/aviary" --version)"
bird_version="$("$MISE_DATA_DIR/command-wrappers/bin/bird" --version)"
[[ "$aviary_version" == "$AVIARY_INSTALL_TEST_VERSION" ]]
[[ "$bird_version" == "$AVIARY_INSTALL_TEST_VERSION" ]]
"$MISE_DATA_DIR/command-wrappers/bin/bird" query-ids --json | uv run --no-project --python 3.14.8 python -c '
import json
import sys
diagnostics = json.load(sys.stdin)
if not diagnostics:
    sys.exit("Expected bundled query-ID diagnostics from the bird wrapper")
'
'''

[tasks._mise_uninstall]
    hide = true
    dir  = "/tmp"
    run  = 'mise uninstall --all "${INSTALL_MISE_PATH}"'
