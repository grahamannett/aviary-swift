name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            container: ""
          - runner: ubuntu-22.04
            container: swift:6.1.3-jammy
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    env:
      AVIARY_SKIP_QUERY_ID_REFRESH: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Use the runner's Xcode
        if: runner.os == 'macOS'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_16.3.app/Contents/Developer' >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: .build
          key: swift-6.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: swift-6.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Install SQLite headers
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y libsqlite3-dev
      - name: Test
        run: swift test
      - uses: astral-sh/setup-uv@v7
      - name: Test release tooling
        run: uv run --no-project --python 3.14 python -m unittest discover -s Tests/Distribution
