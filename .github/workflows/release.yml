name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            arch: arm64
            container: ""
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
            container: ""
          - runner: ubuntu-22.04
            platform: linux
            arch: x86_64
            container: swift:6.1.3-jammy
          - runner: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            container: swift:6.1.3-jammy
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      AVIARY_SKIP_QUERY_ID_REFRESH: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Require a stable version tag
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - name: Use the runner's Xcode
        if: runner.os == 'macOS'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_16.3.app/Contents/Developer' >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: .build
          key: swift-6.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: swift-6.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Install packaging dependencies
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y libsqlite3-dev patchelf
      - name: Test and build
        run: |
          swift test
          swift build -c release
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"
      - name: Package and check the archive
        run: |
          build_dir="$(swift build -c release --show-bin-path)"
          version="$("$build_dir/aviary" --version)"
          [[ "$version" == "${GITHUB_REF_NAME#v}" ]]
          extra_args=()
          if [[ "${{ matrix.platform }}" == linux ]]; then
            extra_args+=(--swift-runtime-license /usr/share/swift/LICENSE.txt)
          fi
          uv run --no-project --python 3.14.8 python scripts/release.py package \
            --build-dir "$build_dir" --output-dir dist --version "$version" \
            --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" "${extra_args[@]}"
          uv run --no-project --python 3.14.8 python scripts/release.py check \
            "dist/aviary-$version-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: aviary-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  linux-runtime:
    needs: build
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aviary-linux-${{ matrix.arch }}
          path: dist
      - name: Check Ubuntu and Debian without Swift installed
        run: |
          for image in ubuntu:22.04 ubuntu:24.04 debian:12; do
            docker run --rm --network none -v "$PWD/dist:/dist:ro" "$image" sh -ec '
              mkdir -p "/tmp/aviary release"
              tar -xzf /dist/*.tar.gz -C "/tmp/aviary release"
              cd "/tmp/aviary release"
              export HOME=/tmp/home XDG_CONFIG_HOME=/tmp/home/.config AVIARY_SKIP_QUERY_ID_REFRESH=1
              libexec/aviary-selftest --resources-only
              bin/aviary query-ids --json
              ln -s "$PWD/bin/aviary" /tmp/bird
              /tmp/bird --help >/dev/null
            '
          done

  publish:
    needs: [build, linux-runtime]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"
      - uses: actions/download-artifact@v4
        with:
          pattern: aviary-*
          path: dist
          merge-multiple: true
      - name: Prepare checksums and Homebrew formula
        run: uv run --no-project --python 3.14.8 python scripts/release.py prepare dist "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
      - name: Publish complete release
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            if [[ "$(jq -r .isDraft release-state.json)" != true ]]; then
              gh release download "$RELEASE_TAG" --pattern aviary.rb --dir dist --clobber
              exit 0
            fi
            gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS dist/aviary.rb --clobber
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Aviary ${RELEASE_TAG#v}" --generate-notes \
              dist/*.tar.gz dist/SHA256SUMS dist/aviary.rb
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - uses: actions/checkout@v4
        if: env.HOMEBREW_TAP_TOKEN != ''
        with:
          repository: grahamannett/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Update Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          mkdir -p homebrew-tap/Formula
          cp dist/aviary.rb homebrew-tap/Formula/aviary.rb
          git -C homebrew-tap config user.name github-actions[bot]
          git -C homebrew-tap config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C homebrew-tap add Formula/aviary.rb
          git -C homebrew-tap diff --cached --quiet || git -C homebrew-tap commit -m "Update aviary to ${RELEASE_TAG#v}"
          git -C homebrew-tap push
      - name: Report manual tap update
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo '::notice::Commit the attached aviary.rb to grahamannett/homebrew-tap, or configure HOMEBREW_TAP_TOKEN for automatic updates.'
