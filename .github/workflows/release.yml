name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            arch: arm64
            container: ""
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
            container: ""
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
            container: swift:6.1.3-noble
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            container: swift:6.1.3-noble
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      AVIARY_SKIP_QUERY_ID_REFRESH: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Require a stable version tag
        run: '[[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]'
      - name: Use the runner's Xcode
        if: runner.os == 'macOS'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_16.3.app/Contents/Developer' >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: .build
          key: swift-6.1-${{ matrix.container || 'xcode-16.3' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: swift-6.1-${{ matrix.container || 'xcode-16.3' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Install packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sed -i 's|http://|https://|g' /etc/apt/sources.list.d/ubuntu.sources
          apt_options=(-o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=2)
          apt-get "${apt_options[@]}" update
          apt-get "${apt_options[@]}" install -y --no-install-recommends libsqlite3-dev patchelf
      - name: Test and build
        run: |
          swift test -c release
          swift build -c release
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"
      - name: Package and check the archive
        run: |
          build_dir="$(swift build -c release --show-bin-path)"
          version="$("$build_dir/aviary" --version)"
          [[ "$version" == "${GITHUB_REF_NAME#v}" ]]
          extra_args=()
          if [[ "${{ matrix.platform }}" == linux ]]; then
            extra_args+=(--swift-runtime-license /usr/share/swift/LICENSE.txt)
          fi
          uv run --no-project --python 3.14.8 python scripts/release.py package \
            --build-dir "$build_dir" --output-dir dist --version "$version" \
            --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" "${extra_args[@]}"
          uv run --no-project --python 3.14.8 python scripts/release.py check \
            "dist/aviary-$version-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: aviary-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  linux-runtime:
    needs: build
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aviary-linux-${{ matrix.arch }}
          path: dist
      - name: Check Ubuntu 24.04 without Swift installed
        run: |
          docker run --rm --network none -v "$PWD/dist:/dist:ro" ubuntu:24.04 sh -ec '
            mkdir -p "/tmp/aviary release"
            tar -xzf /dist/*.tar.gz -C "/tmp/aviary release"
            cd "/tmp/aviary release"
            export HOME=/tmp/home XDG_CONFIG_HOME=/tmp/home/.config AVIARY_SKIP_QUERY_ID_REFRESH=1
            libexec/aviary-selftest --resources-only
            bin/aviary query-ids --json
            ln -s "$PWD/bin/aviary" /tmp/bird
            /tmp/bird --help >/dev/null
          '

  publish:
    needs: [build, linux-runtime]
    runs-on: ubuntu-24.04
    concurrency:
      group: aviary-release-publication
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"
      - uses: actions/download-artifact@v4
        with:
          pattern: aviary-*
          path: dist
          merge-multiple: true
      - name: Test release tooling
        run: uv run --no-project --python 3.14.8 python -m unittest discover -s Tests/Distribution
      - name: Publish complete release
        run: uv run --no-project --python 3.14.8 python scripts/release.py publish-assets dist "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"

  homebrew:
    needs: publish
    runs-on: ubuntu-24.04
    concurrency:
      group: aviary-homebrew-tap
      queue: max
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      HAS_HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"
      - name: Test release tooling
        run: uv run --no-project --python 3.14.8 python -m unittest discover -s Tests/Distribution
      - uses: actions/checkout@v4
        if: env.HAS_HOMEBREW_TAP_TOKEN == 'true'
        with:
          repository: grahamannett/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Update Homebrew tap
        if: env.HAS_HOMEBREW_TAP_TOKEN == 'true'
        run: |
          git -C homebrew-tap config user.name github-actions[bot]
          git -C homebrew-tap config user.email 41898282+github-actions[bot]@users.noreply.github.com
          uv run --no-project --python 3.14.8 python scripts/release.py update-tap "$RELEASE_TAG" \
            --tap-dir homebrew-tap --repository "$GITHUB_REPOSITORY"
      - name: Report manual tap update
        if: env.HAS_HOMEBREW_TAP_TOKEN != 'true'
        run: echo '::notice::The GitHub release is public; Homebrew still needs an update. Configure HOMEBREW_TAP_TOKEN and rerun the homebrew job, or use mise run repair-tap from a current checkout with tap push access.'
